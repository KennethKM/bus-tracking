<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Lusaka Bus Tracker</title>
</head>
<body>
    <main>
        <h1>Reset your password</h1>
        <p>Enter the email address associated with your account. We will send a password-reset link if an eligible account uses that address.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.email.errors }}
            <label for="{{ form.email.id_for_label }}">Email address</label><br>
            {{ form.email }}<br><br>
            <button type="submit">Send reset link</button>
        </form>

        <p><a href="{% url 'passenger_ui' %}">Passenger login</a> | <a href="{% url 'driver_ui' %}">Driver login</a></p>
    </main>
</body>
</html>
