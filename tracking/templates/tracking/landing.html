<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lusaka Bus Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f4c81, #2563eb);
            color: #1f2937;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .welcome-card {
            width: min(100%, 520px);
            background: #ffffff;
            border-radius: 24px;
            padding: 42px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 54px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: #0f4c81;
            font-size: clamp(28px, 6vw, 38px);
        }

        .intro {
            margin: 16px 0 30px;
            color: #4b5563;
            line-height: 1.6;
        }

        .role-options {
            display: grid;
            gap: 14px;
        }

        .role-button {
            display: block;
            padding: 17px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .role-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .passenger-button {
            background: #2563eb;
            color: #ffffff;
        }

        .driver-button {
            background: #eaf2ff;
            color: #0f4c81;
            border: 2px solid #2563eb;
        }

        .note {
            margin: 26px 0 0;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="welcome-card">
        <div class="icon">🚌</div>
        <h1>Lusaka Bus Tracker</h1>
        <p class="intro">
            Plan your journey, view active buses, and support real-time
            vehicle tracking across Lusaka.
        </p>

        <div class="role-options">
            <a class="role-button passenger-button" href="{% url 'passenger_ui' %}">
                Passenger Login
            </a>

            <a class="role-button driver-button" href="{% url 'driver_ui' %}">
                Driver Login
            </a>
        </div>

        <p class="note">
            Choose the option that matches your account type.
        </p>
    </main>
</body>
</html>
