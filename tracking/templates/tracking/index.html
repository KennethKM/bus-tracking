<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lusaka Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 1000;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .bus-list {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .bus-list.show { transform: translateY(0); }
        .bus-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }
        .bus-item:hover { background: #f0f0f0; }
        .close-btn {
            float: right;
            background: #ddd;
            padding: 5px 15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <button onclick="findNearbyBuses()">📍 FIND NEARBY BUSES</button>
        <button onclick="centerLocation()">🎯 MY LOCATION</button>
    </div>
    <div class="bus-list" id="busList">
        <button class="close-btn" onclick="closeBusList()">✕ CLOSE</button>
        <div id="busListContent"></div>
    </div>

    <script>
        let map;
        let busMarkers = new Map();
        let currentLocation = null;
        
        function initMap() {
            map = L.map('map').setView([-15.3875, 28.3228], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            loadStops();
            loadBuses();
            getUserLocation();
        }
        
        async function loadStops() {
            try {
                const response = await fetch('/api/stops/');
                const stops = await response.json();
                stops.forEach(stop => {
                    L.circleMarker([stop.latitude, stop.longitude], {
                        radius: 6, fillColor: '#f59e0b', color: '#fff', weight: 2
                    }).addTo(map).bindPopup(`<b>🛑 ${stop.name}</b>`);
                });
                console.log('Stops loaded:', stops.length);
            } catch(error) {
                console.error('Error loading stops:', error);
            }
        }
        
        async function loadBuses() {
            try {
                const response = await fetch('/api/live-buses/');
                const buses = await response.json();
                
                busMarkers.forEach(marker => map.removeLayer(marker));
                busMarkers.clear();
                
                buses.forEach(bus => {
                    const marker = L.marker([bus.current_lat, bus.current_lng]).addTo(map);
                    marker.bindPopup(`
                        <b>🚌 ${bus.bus_number}</b><br>
                        Route: ${bus.route_name}<br>
                        Speed: ${bus.speed} km/h<br>
                        Seats: ${bus.available_seats} available
                    `);
                    busMarkers.set(bus.id, marker);
                });
                console.log('Buses loaded:', buses.length);
            } catch(error) {
                console.error('Error loading buses:', error);
            }
        }
        
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        const userMarker = L.marker([currentLocation.lat, currentLocation.lng]).addTo(map);
                        userMarker.bindPopup('📍 You are here').openPopup();
                        map.setView([currentLocation.lat, currentLocation.lng], 14);
                        console.log('Location found:', currentLocation);
                    },
                    error => {
                        console.error('Location error:', error);
                        alert('Could not get your location. Please enable GPS.');
                    }
                );
            }
        }
        
        async function findNearbyBuses() {
            if (!currentLocation) {
                alert('Getting your location first...');
                getUserLocation();
                setTimeout(findNearbyBuses, 2000);
                return;
            }
            
            const contentDiv = document.getElementById('busListContent');
            contentDiv.innerHTML = '<p>🔍 Searching for nearby buses...</p>';
            document.getElementById('busList').classList.add('show');
            
            try {
                const url = `/api/passengers/nearby-buses/?latitude=${currentLocation.lat}&longitude=${currentLocation.lng}&radius_km=10`;
                console.log('Fetching:', url);
                
                const response = await fetch(url);
                console.log('Status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Data:', data);
                
                if (data.nearby_buses && data.nearby_buses.length > 0) {
                    let html = '<h3>🚍 Nearby Buses</h3>';
                    data.nearby_buses.forEach(bus => {
                        html += `
                            <div class="bus-item" onclick="zoomToBus(${bus.bus_id})">
                                <div><strong>🚌 ${bus.bus_number}</strong></div>
                                <div>🛣️ ${bus.route_name}</div>
                                <div>📍 ${bus.distance_km} km away</div>
                                <div>⏱️ ETA: ${bus.eta_minutes} minutes</div>
                                <div>🪑 ${bus.available_seats} seats available</div>
                            </div>
                        `;
                    });
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p>❌ No buses found within 10km</p>';
                }
            } catch(error) {
                console.error('Error:', error);
                contentDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        function zoomToBus(busId) {
            const marker = busMarkers.get(busId);
            if (marker) {
                map.setView(marker.getLatLng(), 16);
                marker.openPopup();
                closeBusList();
            }
        }
        
        function centerLocation() {
            if (currentLocation) {
                map.setView([currentLocation.lat, currentLocation.lng], 15);
            } else {
                getUserLocation();
            }
        }
        
        function closeBusList() {
            document.getElementById('busList').classList.remove('show');
        }
        
        document.addEventListener('DOMContentLoaded', initMap);
        setInterval(loadBuses, 30000);
    </script>
</body>
</html>
